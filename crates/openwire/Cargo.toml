[package]
name = "openwire"
description = "OkHttp-inspired async HTTP client for Rust built on hyper and tower"
edition.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["tls-rustls", "platform-verifier", "compression", "cookies"]
tls-rustls = ["dep:openwire-rustls"]
platform-verifier = ["tls-rustls", "openwire-rustls/platform-verifier"]
json = ["openwire-core/json", "dep:serde_json"]
websocket = [
    "openwire-core/websocket",
    "dep:sha1",
    "dep:getrandom",
    "tokio/time",
    "tokio/macros",
    "tokio/io-util",
]
cookies = ["dep:cookie", "dep:cookie_store", "dep:publicsuffix"]
gzip = ["compression-core", "async-compression/gzip"]
deflate = ["compression-core", "async-compression/deflate", "async-compression/zlib"]
brotli = ["compression-core", "async-compression/brotli"]
zstd = ["compression-core", "async-compression/zstd"]
compression-core = ["dep:async-compression", "async-compression/futures-io"]
compression = ["gzip", "deflate", "brotli", "zstd"]

[dependencies]
async-compression = { workspace = true, optional = true }
base64.workspace = true
bytes.workspace = true
cookie = { version = "0.18.0", default-features = false, optional = true }
cookie_store = { version = "0.21.1", default-features = false, features = ["public_suffix"], optional = true }
publicsuffix = { version = "2.3.0", default-features = false, features = ["punycode"], optional = true }
futures-channel.workspace = true
futures-util = { workspace = true, features = ["io"] }
hashbrown.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
hyper.workspace = true
openwire-core.workspace = true
openwire-tokio.workspace = true
getrandom = { workspace = true, optional = true }
openwire-rustls = { workspace = true, optional = true }
parking_lot.workspace = true
pin-project-lite.workspace = true
rustc-hash.workspace = true
slab.workspace = true
smallvec.workspace = true
serde_json = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tower.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
criterion = { version = "0.5.1", features = ["async_tokio"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures-util = { workspace = true, features = ["sink"] }
openwire-test = { workspace = true, features = ["websocket"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true
zstd = { version = "0.13", default-features = false }

[[example]]
name = "cookie_jar"
required-features = ["cookies"]

[[example]]
name = "websocket_echo"
required-features = ["websocket"]

[[example]]
name = "websocket_subprotocol"
required-features = ["websocket"]

[[bench]]
name = "perf_baseline"
harness = false
