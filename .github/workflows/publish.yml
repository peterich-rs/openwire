name: Publish Crates

on:
  workflow_dispatch:
    inputs:
      version:
        description: Workspace version to publish
        required: true
        default: "0.1.0"
      dry_run:
        description: Run package preflight instead of publishing
        required: true
        type: boolean
        default: true
      start_at:
        description: Optional crate name to resume from in publish order
        required: false
        default: ""

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates.io workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify release inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          START_AT: ${{ inputs.start_at }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          workspace_version="$(cargo pkgid -p openwire-core | sed 's/.*#//')"
          test "$workspace_version" = "$INPUT_VERSION"

          if [[ "$DRY_RUN" != "true" ]]; then
            test -n "${CARGO_REGISTRY_TOKEN:-}"
            if [[ "${GITHUB_REF}" != "refs/tags/v${INPUT_VERSION}" ]]; then
              test -n "$START_AT"
              test "${GITHUB_REF}" = "refs/heads/main"
            fi
          fi

      - name: Package preflight
        if: ${{ inputs.dry_run }}
        env:
          START_AT: ${{ inputs.start_at }}
        run: |
          if [[ -n "$START_AT" ]]; then
            scripts/publish-crates.sh --dry-run --start-at "$START_AT"
          else
            scripts/publish-crates.sh --dry-run
          fi

      - name: Publish crates
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          START_AT: ${{ inputs.start_at }}
        run: |
          if [[ -n "$START_AT" ]]; then
            scripts/publish-crates.sh --publish --start-at "$START_AT"
          else
            scripts/publish-crates.sh --publish
          fi
