name: Publish Crates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Workspace version to publish
        required: true
        default: "0.1.1"
      dry_run:
        description: Run package preflight instead of publishing
        required: true
        type: boolean
        default: true
      start_at:
        description: Optional crate name to resume from in publish order
        required: false
        default: ""

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates.io workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Resolve release inputs
        id: release-inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          MANUAL_START_AT: ${{ inputs.start_at }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
              echo "tag publish must run from refs/tags/v<version>; got ${GITHUB_REF}" >&2
              exit 1
            fi

            version="${GITHUB_REF#refs/tags/v}"
            if [[ ! "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "release tag must be v<semver>; got ${GITHUB_REF}" >&2
              exit 1
            fi

            dry_run=false
            start_at=""
          else
            version="$MANUAL_VERSION"
            dry_run="${MANUAL_DRY_RUN:-true}"
            start_at="$MANUAL_START_AT"
          fi

          {
            echo "version=${version}"
            echo "dry_run=${dry_run}"
            echo "start_at=${start_at}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release inputs
        env:
          INPUT_VERSION: ${{ steps.release-inputs.outputs.version }}
          DRY_RUN: ${{ steps.release-inputs.outputs.dry_run }}
          START_AT: ${{ steps.release-inputs.outputs.start_at }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          workspace_version="$(cargo pkgid -p openwire-core | sed 's/.*#//')"
          test "$workspace_version" = "$INPUT_VERSION"

          if [[ "$DRY_RUN" != "true" ]]; then
            test -n "${CARGO_REGISTRY_TOKEN:-}"
            if [[ "${GITHUB_REF}" != "refs/tags/v${INPUT_VERSION}" ]]; then
              test -n "$START_AT"
              test "${GITHUB_REF}" = "refs/heads/main"
            fi
          fi

      - name: Package preflight
        if: ${{ steps.release-inputs.outputs.dry_run == 'true' }}
        env:
          START_AT: ${{ steps.release-inputs.outputs.start_at }}
        run: |
          if [[ -n "$START_AT" ]]; then
            scripts/publish-crates.sh --dry-run --start-at "$START_AT"
          else
            scripts/publish-crates.sh --dry-run
          fi

      - name: Publish crates
        if: ${{ steps.release-inputs.outputs.dry_run != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          START_AT: ${{ steps.release-inputs.outputs.start_at }}
        run: |
          if [[ -n "$START_AT" ]]; then
            scripts/publish-crates.sh --publish --start-at "$START_AT"
          else
            scripts/publish-crates.sh --publish
          fi
