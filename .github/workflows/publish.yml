name: Publish Crates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release identifier in release.json
        required: true
        type: string
      dry_run:
        description: Run package preflight instead of publishing
        required: true
        type: boolean
        default: true

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  publish:
    name: Publish selected crates to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Resolve release inputs
        id: release-inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
              echo "tag publish must run from refs/tags/v<version>; got ${GITHUB_REF}" >&2
              exit 1
            fi

            version="${GITHUB_REF#refs/tags/v}"
            dry_run=false
          else
            version="$MANUAL_VERSION"
            dry_run="${MANUAL_DRY_RUN:-true}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$ ]]; then
            echo "invalid release version: ${version}" >&2
            exit 1
          fi
          if [[ "$dry_run" != "true" && "$GITHUB_REF" != "refs/tags/v${version}" ]]; then
            echo "publishing requires the matching v${version} tag" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "dry_run=${dry_run}"
          } >> "$GITHUB_OUTPUT"

      - name: Package preflight
        if: ${{ steps.release-inputs.outputs.dry_run == 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.release-inputs.outputs.version }}
        run: scripts/publish-crates.sh --dry-run --release "$RELEASE_VERSION"

      - name: Publish crates
        if: ${{ steps.release-inputs.outputs.dry_run != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          RELEASE_VERSION: ${{ steps.release-inputs.outputs.version }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          scripts/publish-crates.sh --publish --release "$RELEASE_VERSION"
