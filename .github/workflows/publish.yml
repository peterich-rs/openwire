name: Publish Crates

on:
  workflow_dispatch:
    inputs:
      version:
        description: Workspace version to publish
        required: true
        default: "0.1.0"
      dry_run:
        description: Run package preflight instead of publishing
        required: true
        type: boolean
        default: true

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates.io workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify release inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          workspace_version="$(cargo pkgid -p openwire-core | sed 's/.*#//')"
          test "$workspace_version" = "$INPUT_VERSION"

          if [[ "$DRY_RUN" != "true" ]]; then
            test "${GITHUB_REF}" = "refs/tags/v${INPUT_VERSION}"
            test -n "${CARGO_REGISTRY_TOKEN:-}"
          fi

      - name: Package preflight
        if: ${{ inputs.dry_run }}
        run: scripts/publish-crates.sh --dry-run

      - name: Publish crates
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: scripts/publish-crates.sh --publish
