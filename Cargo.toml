[workspace]
members = [
    "crates/openwire",
    "crates/openwire-cache",
    "crates/openwire-core",
    "crates/openwire-fastwebsockets",
    "crates/openwire-tokio",
    "crates/openwire-rustls",
    "crates/openwire-test",
    "crates/openwire-tungstenite",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.2"
authors = ["OpenWire contributors"]
repository = "https://github.com/peterich-rs/openwire"
rust-version = "1.80"
readme = "README.md"
categories = ["asynchronous", "network-programming", "web-programming::http-client"]
keywords = ["http", "client", "async", "hyper", "okhttp"]

[workspace.dependencies]
async-trait = "0.1.89"
async-compression = { version = "=0.4.18", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["std"] }
bytes = "1.10.1"
fastwebsockets = { version = "0.10", default-features = false, features = ["unstable-split"] }
futures-channel = { version = "0.3.31", default-features = false, features = ["std"] }
futures-core = { version = "0.3.31", default-features = false, features = ["std"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
getrandom = "0.2"
hashbrown = { version = "0.15", default-features = false }
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
httpdate = "1.0.3"
hyper = { version = "1.8.1", default-features = false, features = ["client", "http1", "http2"] }
openwire = { path = "crates/openwire", version = "0.1.2", default-features = false }
openwire-cache = { path = "crates/openwire-cache", version = "0.1.2" }
openwire-core = { path = "crates/openwire-core", version = "0.1.2" }
openwire-fastwebsockets = { path = "crates/openwire-fastwebsockets", version = "0.1.2" }
openwire-rustls = { path = "crates/openwire-rustls", version = "0.1.2", default-features = false }
openwire-test = { path = "crates/openwire-test" }
openwire-tokio = { path = "crates/openwire-tokio", version = "0.1.2" }
openwire-tungstenite = { path = "crates/openwire-tungstenite", version = "0.1.2" }
parking_lot = { version = "0.12", default-features = false }
pin-project-lite = "0.2.16"
rcgen = "0.14.5"
rustc-hash = { version = "2.1", default-features = false }
rustls = { version = "0.23.35", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-webpki = { version = "0.103.10", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-native-certs = "0.8.2"
rustls-pemfile = "2.2.0"
rustls-platform-verifier = "0.6.2"
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.145", default-features = false, features = ["std"] }
sha1 = { version = "0.10", default-features = false }
slab = { version = "0.4", default-features = false }
smallvec = { version = "1.13", default-features = false }
thiserror = { version = "2.0.17", default-features = false, features = ["std"] }
tokio = { version = "1.48.0", default-features = false }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["tls12", "aws_lc_rs"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = { version = "0.1.41", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["env-filter", "fmt", "std", "ansi"] }
url = { version = "2.5.7", default-features = false, features = ["std"] }
